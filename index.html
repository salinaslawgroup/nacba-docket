<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#0B243A">
<title>NACBA Webinar Docket</title>
<style>
  /* NACBA brand — sampled from the logo files.
     navy #0B243A · mid blue #4F98CA · light blue #BADEF6
     --accent is the brand blue darkened to #1D6091 so small text on white
     clears WCAG AA; --brand keeps the true #4F98CA for bars and fills. */
  :root {
    --ground:#F0F3F6; --surface:#FFF; --surface-2:#F6F8FA;
    --ink:#0B243A; --muted:#52657A; --faint:#8497A9;
    --accent:#1D6091; --brand:#4F98CA; --accent-soft:#E4F0F9;
    --critical:#9E2A33; --critical-soft:#F8E9EA;
    --warn:#8A6210; --warn-soft:#F8F0DE;
    --ok:#2A6650; --ok-soft:#E3F0EA;
    --rule:#D9E0E7; --rule-strong:#BECAD5;
    --shadow:0 1px 2px rgba(11,36,58,.06);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0A1621; --surface:#0F2130; --surface-2:#152B3C;
    --ink:#E4EDF4; --muted:#9BB0C2; --faint:#7A8FA1;
    --accent:#7FB6DC; --brand:#4F98CA; --accent-soft:#123048;
    --critical:#E58B90; --critical-soft:#3A1E21;
    --warn:#D6AB5C; --warn-soft:#332815;
    --ok:#6FBF9C; --ok-soft:#15302A;
    --rule:#22384A; --rule-strong:#334C60;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --ground:#0A1621; --surface:#0F2130; --surface-2:#152B3C;
    --ink:#E4EDF4; --muted:#9BB0C2; --faint:#7A8FA1;
    --accent:#7FB6DC; --brand:#4F98CA; --accent-soft:#123048;
    --critical:#E58B90; --critical-soft:#3A1E21;
    --warn:#D6AB5C; --warn-soft:#332815;
    --ok:#6FBF9C; --ok-soft:#15302A;
    --rule:#22384A; --rule-strong:#334C60;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.55;margin:0;padding:0 1.5rem 5rem;-webkit-font-smoothing:antialiased}

  /* The logo is never recolored. It sits on its own white plate so it
     reads correctly on both the light ground and the dark one. */
  .logo-plate{display:inline-block;background:#FFF;padding:.4rem .55rem;border-radius:3px;
    line-height:0;margin:0 0 .9rem;border:1px solid var(--brand)}
  .logo-plate img{display:block;width:200px;height:auto}
  @media (max-width:34rem){.logo-plate img{width:160px}}
  .wrap{max-width:64rem;margin:0 auto}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mono,.m,.today,.eyebrow,.btn,.tab,.chip,.gate-label,.card-date,.card-days,.card-foot,
  .panel-head,.sp-meta,.alerts-head,.a-date,.a-go,.back,.d-date,.gate-mark,.note-row,
  td.c-off,td.c-date,td.c-owner,td.c-src,td.c-by,table.dk th,table.pk th,footer,
  .saving,.hist-when,.hist-who,.field-label,.mini{
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums}

  /* ---- sign-in ---- */
  .gate{max-width:26rem;margin:0 auto;padding:6rem 0}
  .gate h1{font-size:2rem;letter-spacing:-.02em;font-weight:600;margin:0 0 .75rem;line-height:1.1}
  .gate p{color:var(--muted);font-size:.95rem;margin:0 0 1.75rem}
  .gate form{display:flex;flex-direction:column;gap:.7rem}
  .gate input{font:inherit;padding:.6rem .75rem;border:1px solid var(--rule-strong);
    border-radius:3px;background:var(--surface);color:var(--ink);font-size:.95rem}
  .gate button[type=submit]{background:var(--accent);color:var(--ground);border:none;
    border-radius:3px;padding:.65rem;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;
    letter-spacing:.09em;text-transform:uppercase}
  .msg{font-size:.9rem;padding:.75rem .9rem;border-radius:3px;margin-top:1rem}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.err{background:var(--critical-soft);color:var(--critical)}
  .gate .fine{font-size:.82rem;color:var(--faint);margin-top:1.5rem}

  /* ---- masthead ---- */
  header.masthead{padding:3rem 0 1.5rem;border-bottom:2px solid var(--ink);margin-bottom:2rem;
    display:flex;flex-wrap:wrap;gap:1.25rem;align-items:flex-end;justify-content:space-between}
  .eyebrow{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 .75rem}
  h1{font-size:clamp(1.9rem,4.5vw,2.5rem);line-height:1.06;letter-spacing:-.02em;font-weight:600;margin:0}
  .masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
  .today{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:right}
  .btn-row{display:flex;gap:.4rem;flex-wrap:wrap}
  .btn{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
    padding:.38rem .7rem;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ground)}
  .btn.danger:hover{border-color:var(--critical);color:var(--critical)}
  .mini{font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;background:none;
    border:none;padding:.15rem .3rem;color:var(--faint)}
  .mini:hover{color:var(--accent);text-decoration:underline}
  .mini.danger:hover{color:var(--critical)}
  a.mini{text-decoration:none;white-space:nowrap;align-self:center}

  /* ---- alerts ---- */
  .alerts{margin-bottom:2rem}
  .alerts-head{font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--critical);margin:0 0 .6rem}
  .alert{display:grid;grid-template-columns:5.5rem 1fr auto;gap:0 1rem;align-items:baseline;
    padding:.65rem .9rem;background:var(--critical-soft);border-left:3px solid var(--critical);
    border-radius:0 3px 3px 0;margin-bottom:2px}
  .a-date{font-size:.72rem;font-weight:600;color:var(--critical);white-space:nowrap}
  .a-text{font-size:.92rem}
  .a-go{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--critical);
    background:none;border:none;padding:0;white-space:nowrap}
  .a-go:hover{text-decoration:underline}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:.25rem;margin-bottom:1.5rem;border-bottom:1px solid var(--rule);
    align-items:center;flex-wrap:wrap}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:.5rem .85rem;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .count{opacity:.6;margin-left:.3rem}
  .tabs .spacer{flex:1}

  /* ---- cards ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:1rem}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:1.1rem 1.2rem 1rem;text-align:left;width:100%;display:flex;flex-direction:column;
    gap:.7rem;box-shadow:var(--shadow);transition:border-color .12s ease}
  .card:hover{border-color:var(--accent)}
  .card.is-past{opacity:.72}
  .card.is-urgent{border-left:3px solid var(--critical)}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
  .card-date{font-size:.74rem;font-weight:600;letter-spacing:.03em;color:var(--accent);white-space:nowrap}
  .card-days{font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .card-days.soon{color:var(--warn)}
  .card h3{font-size:1.02rem;font-weight:600;line-height:1.32;margin:0;letter-spacing:-.004em}
  .speakers-line{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.3rem .45rem;align-items:center}
  .sp{display:inline-flex;align-items:center;gap:.3rem}
  .sp-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
  .sp-dot.un{background:var(--warn)}
  .sp-none{color:var(--critical);font-style:italic}
  .gates{display:flex;gap:.3rem;margin-top:.15rem;padding-top:.7rem;border-top:1px solid var(--rule)}
  .gate-c{flex:1;display:flex;flex-direction:column;gap:.3rem}
  .gate-bar{height:3px;border-radius:2px;background:var(--rule-strong)}
  .gate-c.done .gate-bar{background:var(--ok)}
  .gate-c.late .gate-bar{background:var(--critical)}
  .gate-label{font-size:.55rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gate-c.done .gate-label{color:var(--ok)}
  .gate-c.late .gate-label{color:var(--critical)}
  .card-foot{font-size:.66rem;letter-spacing:.04em;color:var(--faint);display:flex;
    justify-content:space-between;gap:.5rem}
  .card-foot .late-n{color:var(--critical);font-weight:600}

  /* ---- detail ---- */
  .back{background:none;border:none;padding:0;font-size:.68rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);margin-bottom:1.5rem}
  .back:hover{text-decoration:underline}
  .detail-head{margin-bottom:2rem}
  .detail-head .d-date{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);margin:0 0 .6rem;display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap}
  .detail-head h2{font-size:clamp(1.4rem,3.5vw,1.95rem);line-height:1.15;letter-spacing:-.015em;
    font-weight:600;margin:0 0 .85rem;text-wrap:balance;max-width:34ch}
  .detail-head p.desc{color:var(--muted);font-size:.95rem;margin:0;max-width:68ch}
  .detail-head p.desc.missing{color:var(--critical);font-style:italic}
  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:1.1rem 1.25rem;margin-bottom:1.75rem;box-shadow:var(--shadow)}
  .panel-head{font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin:0 0 .9rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
  .sp-row{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;padding:.65rem 0;
    border-top:1px solid var(--rule);align-items:center}
  .sp-row:first-of-type{border-top:none;padding-top:0}
  .sp-name{font-weight:600;font-size:.97rem}
  .sp-meta{font-size:.72rem;color:var(--muted);margin-top:.15rem;word-break:break-word}
  .sp-actions{display:flex;gap:.5rem;align-items:center}
  .chip{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .45rem;
    border-radius:2px;white-space:nowrap}
  .chip-ok{background:var(--ok-soft);color:var(--ok)}
  .chip-warn{background:var(--warn-soft);color:var(--warn)}
  .empty-note{color:var(--critical);font-style:italic;font-size:.93rem;margin:0 0 .5rem}
  .note-row{border-top:1px solid var(--rule);padding-top:.65rem;margin-top:.35rem;
    font-size:.74rem;color:var(--warn);line-height:1.5}

  /* ---- forms ---- */
  .form{display:flex;flex-direction:column;gap:.9rem;margin:0}
  .field{display:flex;flex-direction:column;gap:.3rem}
  .field-label{font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
  .form input[type=text],.form input[type=date],.form input[type=email],.form textarea,.form select{
    font:inherit;font-size:.94rem;padding:.5rem .65rem;border:1px solid var(--rule-strong);
    border-radius:3px;background:var(--surface-2);color:var(--ink);width:100%}
  .form textarea{min-height:6rem;resize:vertical;line-height:1.5}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.9rem}
  .form-actions{display:flex;gap:.5rem;align-items:center;margin-top:.2rem}
  select.conf{font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.66rem;
    letter-spacing:.06em;text-transform:uppercase;padding:.22rem .4rem;border-radius:2px;
    border:1px solid var(--rule-strong);background:var(--surface-2);color:var(--muted)}
  .add-row{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap;
    border-top:1px solid var(--rule);padding-top:.85rem;margin-top:.35rem}
  .add-row .field{flex:1;min-width:14rem}

  /* ---- tables ---- */
  .dk-scroll,.pk-scroll{overflow-x:auto}
  table.dk{width:100%;min-width:42rem;border-collapse:collapse;font-size:.88rem}
  table.dk th{font-size:.58rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
    text-align:left;font-weight:400;padding:0 .75rem .55rem 0;border-bottom:1px solid var(--rule-strong)}
  table.dk td{padding:.5rem .75rem .5rem 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
  table.dk td.c-check{width:1.9rem;padding-right:.5rem}
  table.dk input[type=checkbox],table.pk input[type=checkbox]{width:15px;height:15px;
    accent-color:var(--accent);cursor:pointer;margin:0;vertical-align:middle}
  td.c-off{font-size:.76rem;font-weight:600;color:var(--accent);white-space:nowrap}
  td.c-date{font-size:.74rem;color:var(--muted);white-space:nowrap}
  td.c-owner,td.c-src,td.c-by{font-size:.68rem;color:var(--faint);white-space:nowrap}
  tr.done td.c-task{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
  tr.done td.c-off{color:var(--faint)}
  tr.late td.c-date{color:var(--critical);font-weight:600}
  tr.late td.c-off{color:var(--critical)}
  tr.soon td.c-date{color:var(--warn);font-weight:600}
  .gate-mark{font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--critical);
    margin-left:.5rem;white-space:nowrap}
  tr.done .gate-mark{color:var(--faint)}
  table.pk{width:100%;min-width:34rem;border-collapse:collapse;font-size:.85rem}
  table.pk th{font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    font-weight:400;text-align:center;padding:0 .4rem .55rem;border-bottom:1px solid var(--rule-strong)}
  table.pk th.n{text-align:left;padding-left:0}
  table.pk td{padding:.5rem .4rem;border-bottom:1px solid var(--rule);text-align:center}
  table.pk td.n{text-align:left;padding-left:0;font-size:.9rem}

  /* ---- history ---- */
  .hist{display:flex;flex-direction:column}
  .hist-item{display:grid;grid-template-columns:6.5rem 1fr;gap:.2rem .9rem;padding:.55rem 0;
    border-top:1px solid var(--rule);align-items:baseline}
  .hist-item:first-child{border-top:none;padding-top:0}
  .hist-when{font-size:.66rem;color:var(--faint);white-space:nowrap}
  .hist-what{font-size:.9rem}
  .hist-what .f{color:var(--accent);font-weight:600}
  .hist-what .old{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
  .hist-who{font-size:.64rem;color:var(--faint);letter-spacing:.04em}
  .hist-empty{color:var(--faint);font-size:.9rem;margin:0}

  footer{margin-top:3.5rem;padding-top:1.25rem;border-top:2px solid var(--ink);
    font-size:.66rem;letter-spacing:.05em;color:var(--faint);text-transform:uppercase;
    display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between}
  .saving{position:fixed;bottom:1rem;right:1rem;background:var(--surface);
    border:1px solid var(--rule-strong);border-radius:3px;padding:.4rem .7rem;font-size:.66rem;
    letter-spacing:.06em;text-transform:uppercase;color:var(--muted);box-shadow:var(--shadow);z-index:9}
  .saving.err{color:var(--critical);border-color:var(--critical)}
  @media (max-width:34rem){
    body{padding:0 1rem 4rem} header.masthead{padding-top:2rem}
    .masthead-right{align-items:flex-start}
    .alert{grid-template-columns:1fr;gap:.3rem} .a-go{justify-self:start}
    .hist-item{grid-template-columns:1fr}
    .sp-row{grid-template-columns:1fr;align-items:start}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const SUPABASE_URL = "https://lnollnddtavdhigkkefy.supabase.co";
const SUPABASE_KEY = "sb_publishable_OAzj077fESqmwN8LUre8Lg_yWPVjTUQ";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const PACKAGE_ITEMS = [
  { id:"bio", label:"Bio" }, { id:"headshot", label:"Headshot" },
  { id:"agreement", label:"Agreement" }, { id:"outline", label:"Outline" },
  { id:"powerpoint", label:"PowerPoint" }
];
const GATE_LABELS = [
  { key:"speakers", label:"Speakers" }, { key:"agreements", label:"Agreements" },
  { key:"registration", label:"Registration" }, { key:"materials", label:"Materials" },
  { key:"runofshow", label:"Run of show" }
];
const CONFIRMATIONS = ["invited","asked","confirmed","declined"];
const FIELD_NAMES = {
  title:"title", description:"description", event_date:"date", note:"note",
  confirmation:"confirmation", topic:"topic", full_name:"name", email:"email",
  firm:"firm", preferred_title:"preferred title", pronunciation:"pronunciation",
  headshot_location:"headshot location", bio_location:"bio location", phone:"phone",
  added:"added", removed:"removed", confirmed_on:"confirmed on", kind:"type", archived:"archived"
};

const DAY = 86400000;
const FMT_SHORT = new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
const FMT_FULL  = new Intl.DateTimeFormat("en-US",{weekday:"short",month:"long",day:"numeric",year:"numeric",timeZone:"UTC"});
const FMT_CARD  = new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
const FMT_LOG   = new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

const parseISO = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays  = (dt,n) => new Date(dt.getTime()+n*DAY);
const todayUTC = () => { const n=new Date(); return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); };
const diffDays = (a,b) => Math.round((b-a)/DAY);
const offLabel = o => o===0 ? "T−0" : (o<0 ? "T−"+Math.abs(o) : "T+"+o);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = id => (document.getElementById(id)?.value ?? "").trim();

let session=null, programs=[], roster=[], history=[], links={}, busy=false;
let view = { name:"season", tab:"upcoming", id:null, edit:false, editSpeaker:null, creating:false };
const app = document.getElementById("app");

/* ================= sign in ================= */
function renderGate(msg, kind) {
  app.innerHTML =
    '<div class="gate"><span class="logo-plate"><img src="assets/nacba-logo.png" ' +
    'alt="National Association of Consumer Bankruptcy Attorneys" width="200" height="35"></span>' +
    '<p class="eyebrow">Education Committee</p><h1>Webinar Docket</h1>' +
    "<p>Enter your work email and we'll send you a sign-in link. No password to remember.</p>" +
    '<form id="signin"><input type="email" id="email" placeholder="you@example.com" required autocomplete="email">' +
    '<button type="submit">Send sign-in link</button></form>' +
    (msg ? '<div class="msg '+kind+'">'+esc(msg)+"</div>" : "") +
    '<p class="fine">Access is limited to staff on the Education Committee list.</p></div>';
  document.getElementById("signin").addEventListener("submit", async e => {
    e.preventDefault();
    const btn=e.target.querySelector("button"), email=val("email");
    btn.disabled=true; btn.textContent="Sending…";
    const { error } = await sb.auth.signInWithOtp({ email,
      options:{ emailRedirectTo: window.location.href.split("#")[0] } });
    renderGate(error ? error.message : "Check "+email+" for your sign-in link. It expires in an hour.",
      error ? "err" : "ok");
  });
}

/* ================= data ================= */
async function loadData() {
  const [pRes, sRes, lRes] = await Promise.all([
    sb.from("programs").select(`id, slug, event_date, title, description, note,
      program_speakers ( id, topic, confirmation, sort_order,
        speakers ( id, full_name, preferred_title, firm, email, phone, pronunciation,
                   headshot_location, bio_location ),
        deliverables ( id, item, received ) ),
      tasks ( id, offset_days, seq, task, owner_role, source_ref, is_gate, gate_key, done, done_by )`)
      .order("event_date"),
    sb.from("speakers").select("id, full_name").order("full_name"),
    sb.from("speaker_links")
      .select("program_speaker_id, token, open_count, last_opened_at, revoked")
  ]);
  if (pRes.error) throw pRes.error;
  programs = (pRes.data||[]).map(p => ({ ...p,
    program_speakers:(p.program_speakers||[]).sort((a,b)=>a.sort_order-b.sort_order),
    tasks:(p.tasks||[]).sort((a,b)=>a.offset_days-b.offset_days||a.seq-b.seq) }));
  roster = sRes.data || [];
  // 04_speaker_links.sql may not have been run yet — degrade quietly
  links = {};
  (lRes.error ? [] : (lRes.data||[])).forEach(l => { links[l.program_speaker_id] = l; });
}

const speakerUrl = token => new URL("speaker.html", location.href).href + "?k=" + token;

/* Template A from "7. Speaker Invitation Emails (staff).docx", with the
   merge fields already filled from the record. Webinar only — a conference
   needs registration, hotel, and room details this app does not hold. */
function invitationEmail(p, ps) {
  const s  = ps.speakers || {};
  const lk = links[ps.id];
  // Never first-name a judge. If the record carries an honorific we cannot
  // reliably split a compound surname, so address the name exactly as written.
  const name = (s.full_name || "").trim();
  const formal = /^(Hon\.?|Judge|Justice|Prof\.?|Professor|Dr\.?)\s+/i.test(name);
  const salutation = formal
    ? name.replace(/,\s*Esq\.$/i, "")
    : name.replace(/,\s*Esq\.$/i, "").split(/\s+/)[0];
  const co = p.program_speakers.filter(x => x.id !== ps.id)
    .map(x => x.speakers?.full_name).filter(Boolean);
  const d = parseISO(p.event_date);
  const long = new Intl.DateTimeFormat("en-US",
    { weekday:"long", month:"long", day:"numeric", year:"numeric", timeZone:"UTC" }).format(d);

  return [
`Dear ${salutation},`, ``,
`Thank you for agreeing to present for NACBA. This message confirms your program and gives you everything you will need.`, ``,
`YOUR PROGRAM`,
p.title,
`${long} · 12:00 – 1:30 p.m. Pacific (3:00 – 4:30 p.m. Eastern)`,
`Live webinar on Zoom. You will receive your join link separately, closer to the date.`,
...(ps.topic ? [`Your topic on this program: ${ps.topic}`] : []),
...(co.length ? [`Presenting with you: ${co.join(", ")}`] : []),
``,
`YOUR SPEAKER PACKET`,
`Everything we need from you, and the date each item is due, is on your own packet page:`,
lk ? speakerUrl(lk.token) : `[CREATE THE PACKET LINK FIRST — then copy this email again]`,
``,
`The page shows your deadlines as real calendar dates, tracks what we have already received, and holds every template you need — biography, outline, agreement, and PowerPoint. It is personal to you, so please do not forward it.`,
``,
`THE THREE DATES THAT MATTER`,
`• Signed Speaker Agreement — we cannot publish any marketing for the program until this is on file.`,
`• Biography and headshot — used for promotion and for your introduction on air.`,
`• Written materials — a target date two weeks out, and a firm date one week out. The firm date is set by CLE filing requirements and cannot move.`,
`Exact dates for each are on your packet page.`,
``,
`WHAT NACBA WILL DO`,
`• Promote the program to our membership, including your name, headshot, and firm.`,
`• Send you branded "I am speaking at NACBA" graphics and suggested post copy at least two weeks before the program, for your own social media.`,
`• Run a technology check with you beforehand — microphone, camera, lighting, connection, and background.`,
`• Record the session and make it available in the NACBA store.`,
``,
`ON THE DAY`,
`Please join 30 minutes before the start time. We will admit you early for a final check of audio, video, and screen sharing. Attendee questions come through Zoom's Q&A rather than chat, and your moderator will bring them to you.`,
``,
`TWO THINGS WORTH FLAGGING`,
`NACBA programs are educational rather than promotional, so please do not endorse or criticize any vendor. If a tool is relevant to your topic, describe it as your own practice choice — and if an attendee asks what you use, answer briefly and return to the substance. We also ask speakers to conduct themselves consistently with NACBA's Diversity, Equity, and Inclusion Policy. Both are set out in full in the Speaker Agreement on your packet page.`,
``,
`If anything here is wrong — particularly how your name should be pronounced — just reply and tell me.`,
``,
`With thanks,`,
(session?.user?.email || "").split("@")[0],
`NACBA Education Committee`,
`admin@nacba.com · (800) 499-9040`
  ].join("\n");
}

async function loadHistory(programId) {
  let q = sb.from("change_log")
    .select("id, table_name, program_id, label, field, old_value, new_value, changed_by, changed_at")
    .order("changed_at", { ascending:false }).limit(40);
  q = programId ? q.eq("program_id", programId) : q;
  const { data, error } = await q;
  history = error ? [] : (data || []);
}

/* ================= derived ================= */
const isPast = p => parseISO(p.event_date) < todayUTC();
const speakersOk = p => p.program_speakers.length>0 &&
  p.program_speakers.every(ps => ps.confirmation==="confirmed");
function taskStatus(p,t){
  const due=addDays(parseISO(p.event_date),t.offset_days), now=todayUTC();
  if (t.done) return "done";
  if (due<now) return "late";
  return diffDays(now,due)<=7 ? "soon" : "open";
}
function gateState(p,key){
  if (key==="speakers") return speakersOk(p) ? "done"
    : (addDays(parseISO(p.event_date),-35)<todayUTC() ? "late":"open");
  const t=p.tasks.find(x=>x.gate_key===key);
  if (!t) return "open";
  const st=taskStatus(p,t);
  return st==="done" ? "done" : (st==="late" ? "late":"open");
}
const lateCount = p => p.tasks.filter(t=>taskStatus(p,t)==="late").length;
function alertsFor(p){
  if (isPast(p)) return [];
  const out=[];
  if (!p.program_speakers.length) out.push("No speakers named");
  else if (!speakersOk(p)) out.push("Speakers not confirmed");
  if (!p.description) out.push("No description for registration");
  const n=lateCount(p);
  if (n) out.push(n+(n===1?" task overdue":" tasks overdue"));
  return out;
}

function card(p){
  const d=parseISO(p.event_date), days=diffDays(todayUTC(),d);
  const past=days<0, late=lateCount(p), urgent=!past&&alertsFor(p).length>0;
  const daysTxt = past?Math.abs(days)+" days ago":(days===0?"Today":days+" days out");
  const sp = p.program_speakers.length
    ? p.program_speakers.map(ps=>'<span class="sp"><span class="sp-dot'+
        (ps.confirmation==="confirmed"?"":" un")+'"></span>'+
        esc((ps.speakers?.full_name||"").replace(/,\s*Esq\.$/,""))+"</span>").join("")
    : '<span class="sp-none">No speakers named</span>';
  const gates = GATE_LABELS.map(g=>'<div class="gate-c '+gateState(p,g.key)+
    '"><div class="gate-bar"></div><div class="gate-label">'+esc(g.label)+"</div></div>").join("");
  return '<button class="card'+(past?" is-past":"")+(urgent?" is-urgent":"")+'" data-open="'+p.id+
    '"><div class="card-top"><span class="card-date">'+esc(FMT_CARD.format(d))+
    '</span><span class="card-days'+(!past&&days<=35?" soon":"")+'">'+esc(daysTxt)+
    "</span></div><h3>"+esc(p.title)+"</h3>"+'<div class="speakers-line">'+sp+
    '</div><div class="gates">'+gates+'</div><div class="card-foot"><span>'+
    (past?"Complete":"12:00–1:30 PT")+"</span>"+
    (late?'<span class="late-n">'+late+" overdue</span>":"<span></span>")+"</div></button>";
}

/* ================= saving ================= */
let toastEl=null;
function toast(text,isErr){
  if(!toastEl){ toastEl=document.createElement("div"); document.body.appendChild(toastEl); }
  toastEl.className="saving"+(isErr?" err":""); toastEl.textContent=text;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ toastEl?.remove(); toastEl=null; }, isErr?7000:1400);
}

async function mutate(fn, okMsg){
  if (busy) return;
  busy=true; toast("Saving…");
  try {
    const { error } = await fn();
    if (error) throw error;
    await loadData();
    if (view.name==="detail") await loadHistory(view.id);
    else if (view.tab==="history") await loadHistory(null);
    toast(okMsg||"Saved");
  } catch(e){
    toast("Not saved — "+(e.message||e), true);
  } finally { busy=false; render(); }
}

const setTask  = (id,done)     => mutate(()=>sb.from("tasks").update({done}).eq("id",id));
const setDeliv = (id,received) => mutate(()=>sb.from("deliverables")
  .update({received, received_on: received ? new Date().toISOString().slice(0,10) : null}).eq("id",id));
const setConf  = (id,confirmation) => mutate(()=>sb.from("program_speakers")
  .update({confirmation, confirmed_on: confirmation==="confirmed" ? new Date().toISOString().slice(0,10) : null})
  .eq("id",id));
const removeSpeaker = id => mutate(()=>sb.from("program_speakers").delete().eq("id",id), "Speaker removed");

function slugFor(date,title){
  const base = date+"-"+String(title).toLowerCase().replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"").split("-").filter(Boolean).slice(0,4).join("-");
  const taken = new Set(programs.map(p=>p.slug));
  if (!taken.has(base)) return base;
  let i=2; while (taken.has(base+"-"+i)) i++;
  return base+"-"+i;
}

async function createProgram(){
  const date=val("np-date"), title=val("np-title");
  if (!date || !title) { toast("Date and title are both required", true); return; }
  await mutate(()=>sb.from("programs").insert({
    slug: slugFor(date,title), event_date: date, title,
    description: val("np-desc"), note: val("np-note")
  }), "Program created with its docket");
  view = { ...view, creating:false, tab:"upcoming" };
  render();
}

async function saveProgram(id){
  const date=val("ep-date"), title=val("ep-title");
  if (!date || !title) { toast("Date and title are both required", true); return; }
  view.edit=false;
  await mutate(()=>sb.from("programs").update({
    event_date: date, title, description: val("ep-desc"), note: val("ep-note")
  }).eq("id",id));
}

async function saveSpeaker(speakerId, psId){
  const name=val("es-name");
  if (!name) { toast("Name cannot be empty", true); return; }
  const topic=val("es-topic");
  view.editSpeaker=null;
  await mutate(async ()=>{
    const a = await sb.from("speakers").update({
      full_name:name, preferred_title:val("es-title"), firm:val("es-firm"),
      email:val("es-email"), phone:val("es-phone"), pronunciation:val("es-say"),
      headshot_location:val("es-head"), bio_location:val("es-bio")
    }).eq("id", speakerId);
    if (a.error) return a;
    return await sb.from("program_speakers").update({ topic }).eq("id", psId);
  });
}

async function addSpeaker(programId){
  const name=val("add-sp");
  if (!name) { toast("Type a name first", true); return; }
  const p = programs.find(x=>x.id===programId);
  if (p.program_speakers.some(ps=>(ps.speakers?.full_name||"").toLowerCase()===name.toLowerCase())){
    toast(name+" is already on this program", true); return;
  }
  await mutate(async ()=>{
    let hit = roster.find(r=>r.full_name.toLowerCase()===name.toLowerCase());
    if (!hit){
      const ins = await sb.from("speakers").insert({ full_name:name }).select("id, full_name").single();
      if (ins.error) return ins;
      hit = ins.data;
    }
    return await sb.from("program_speakers").insert({
      program_id: programId, speaker_id: hit.id,
      confirmation: "invited", sort_order: p.program_speakers.length
    });
  }, "Speaker added with package items");
}

/* ================= events ================= */
function wire(){
  const on=(sel,ev,fn)=>app.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn.bind(null,el)));

  document.getElementById("signout")?.addEventListener("click", async ()=>{
    await sb.auth.signOut(); session=null; renderGate();
  });
  document.getElementById("hist-all")?.addEventListener("click", async ()=>{
    await loadHistory(null);
    view={ name:"season", tab:"history", id:null, edit:false, editSpeaker:null, creating:false };
    render(); window.scrollTo(0,0);
  });

  on("[data-open]","click",(el,e)=>{ e.stopPropagation();
    view={ ...view, name:"detail", id:el.getAttribute("data-open"), edit:false, editSpeaker:null };
    loadHistory(view.id).then(()=>{ render(); window.scrollTo(0,0); }); });
  on("[data-tab]","click",el=>{
    view={ ...view, name:"season", tab:el.getAttribute("data-tab"), id:null, creating:false }; render(); });
  on("[data-back]","click",()=>{
    view={ ...view, name:"season", id:null, edit:false, editSpeaker:null, creating:false };
    render(); window.scrollTo(0,0); });

  document.getElementById("new-program")?.addEventListener("click",()=>{
    view={ ...view, creating:true }; render(); window.scrollTo(0,0); });
  document.getElementById("np-save")?.addEventListener("click", createProgram);

  document.getElementById("edit-program")?.addEventListener("click",()=>{
    view={ ...view, edit:true }; render(); window.scrollTo(0,0); });
  document.getElementById("ep-cancel")?.addEventListener("click",()=>{
    view={ ...view, edit:false }; render(); });
  document.getElementById("ep-save")?.addEventListener("click",el=>
    saveProgram(document.getElementById("ep-save").getAttribute("data-id")));

  document.getElementById("es-cancel")?.addEventListener("click",()=>{
    view={ ...view, editSpeaker:null }; render(); });
  document.getElementById("es-save")?.addEventListener("click",()=>{
    const b=document.getElementById("es-save");
    saveSpeaker(b.getAttribute("data-sp"), b.getAttribute("data-ps")); });

  document.getElementById("add-sp-btn")?.addEventListener("click",()=>
    addSpeaker(document.getElementById("add-sp-btn").getAttribute("data-program")));
  document.getElementById("add-sp")?.addEventListener("keydown",e=>{
    if (e.key==="Enter"){ e.preventDefault();
      addSpeaker(document.getElementById("add-sp-btn").getAttribute("data-program")); } });

  on("[data-newlink]","click",el=>
    mutate(()=>sb.from("speaker_links").insert({ program_speaker_id: el.getAttribute("data-newlink") }),
      "Packet link created — copy it next"));
  on("[data-copylink]","click",async el=>{
    const url = speakerUrl(el.getAttribute("data-copylink"));
    try { await navigator.clipboard.writeText(url); toast("Link copied"); }
    catch (e) { window.prompt("Copy this link and send it to the speaker:", url); }
  });
  on("[data-email]","click",async el=>{
    const p = programs.find(x => x.id === view.id);
    const ps = p.program_speakers.find(x => x.id === el.getAttribute("data-email"));
    const body = invitationEmail(p, ps);
    try { await navigator.clipboard.writeText(body); toast("Invitation email copied"); }
    catch (e) { window.prompt("Copy this email:", body); }
  });

  on("[data-editsp]","click",el=>{
    view={ ...view, editSpeaker: el.getAttribute("data-editsp") }; render(); });
  on("[data-rmsp]","click",el=>{
    if (confirm("Remove "+el.getAttribute("data-name")+" from this program?\n\nTheir package items go too. The roster record stays."))
      removeSpeaker(el.getAttribute("data-rmsp")); });
  on("[data-conf]","change",el=>setConf(el.getAttribute("data-conf"), el.value));
  on("[data-task]","change",el=>setTask(el.getAttribute("data-task"), el.checked));
  on("[data-deliv]","change",el=>setDeliv(el.getAttribute("data-deliv"), el.checked));
}

/* ================= boot ================= */
async function boot(){
  const { data } = await sb.auth.getSession();
  session=data.session;
  if (!session) { renderGate(); return; }
  try {
    await loadData();
    if (!programs.length){
      app.innerHTML='<div class="gate"><p class="eyebrow">Signed in as '+esc(session.user.email)+
        '</p><h1>No access yet</h1><p>You are signed in, but this address is not on the '+
        "Education Committee list, so there is nothing to show. Ask an administrator to add it.</p>"+
        '<button class="btn" id="so2">Sign out</button></div>';
      document.getElementById("so2").addEventListener("click", async ()=>{
        await sb.auth.signOut(); session=null; renderGate(); });
      return;
    }
    render();
  } catch(e){
    app.innerHTML='<div class="gate"><h1>Could not load</h1><div class="msg err">'+
      esc(e.message||String(e))+"</div></div>";
  }
}

sb.auth.onAuthStateChange(ev=>{
  if ((ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED") && !session) boot();
});
boot();
</script>
